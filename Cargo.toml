[workspace]
resolver = "2"
members = ["crates/core", "crates/cli"]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "MIT"
authors = ["Juan Alvarado <juancaalvarado@gmail.com>"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# Optimized but quick to rebuild, for trying changes: `cargo build --profile quick`.
[profile.quick]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
